<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nebula Cloud</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Animated BG -->
  <div class="bg-orbs">
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
  </div>
  <div class="grid-overlay"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <div class="icon">N</div>
      <div>
        Nebula <span><small>Self-Hosted</small></span>
      </div>
    </div>

    <div class="nav-section">
      <div class="label">Main</div>
      <div class="nav-item active" onclick="switchView('all')">
        <span class="ico">📁</span> My Files
        <span class="badge" id="fileCount">0</span>
      </div>
      <div class="nav-item" onclick="switchView('starred')">
        <span class="ico">⭐</span> Starred
      </div>
      <div class="nav-item" onclick="switchView('trash')">
        <span class="ico">🗑️</span> Trash
        <span class="badge" id="trashCount">0</span>
      </div>
    </div>

    <div class="nav-section">
      <div class="label">Spaces</div>
      <div class="nav-item">
        <span class="ico">💻</span> Local PC
        <span class="badge" id="localCount">0</span>
      </div>
    </div>

    <div class="spacer"></div>

    <div class="usage">
      <div class="head">
        <span>Storage</span>
        <span id="usagePercent">0%</span>
      </div>
      <div class="bar">
        <div class="fill" id="usageFill" style="width:0%"></div>
      </div>
      <div style="margin-top:10px;font-size:12px;color:var(--text-muted);">
        <span id="usedStorage">0 B</span> / <span id="totalStorage">200 GB</span>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="main">

    <!-- Top Bar -->
    <div class="topbar">
      <div class="left">
        <h1>Nebula Cloud ☁️</h1>
        <p id="welcomeMsg">Your PC is the cloud</p>
      </div>
      <div class="right">
        <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
        <div class="search-box">
          <span class="s-ico">🔍</span>
          <input type="text" id="searchInput" placeholder="Search files..." oninput="searchFiles(this.value)" />
        </div>
        <div class="avatar" title="Local PC">💻</div>
      </div>
    </div>

    <!-- Quick Stats -->
    <div class="stats">
      <div class="stat-card">
        <div class="stat-icon">📂</div>
        <div class="stat-value" id="statTotalFiles">0</div>
        <div class="stat-label">Total Files</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">💾</div>
        <div class="stat-value" id="statStorageUsed">0 B</div>
        <div class="stat-label">Storage Used</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">📤</div>
        <div class="stat-value" id="statUploaded">0</div>
        <div class="stat-label">Uploads</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">⚡</div>
        <div class="stat-value">100%</div>
        <div class="stat-label">Local</div>
      </div>
    </div>

    <!-- Actions -->
    <div class="action-bar">
      <div class="tabs">
        <button class="tab active" onclick="switchView('all')">All Files</button>
        <button class="tab" onclick="filterByType('documents')">Documents</button>
        <button class="tab" onclick="filterByType('media')">Media</button>
        <button class="tab" onclick="filterByType('archives')">Archives</button>
      </div>
      <div class="actions">
        <button onclick="document.getElementById('fileUpload').click()">⬆️ Upload</button>
        <button onclick="createFolder()">📁 New Folder</button>
        <button class="primary" onclick="refreshFiles()">🔄 Refresh</button>
      </div>
    </div>

    <input type="file" id="fileUpload" style="display:none" multiple onchange="uploadFiles(this.files)" />

    <!-- File Grid -->
    <div class="file-grid" id="fileGrid">
      <div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-muted);">
        Loading files...
      </div>
    </div>

    <!-- Recent Activity -->
    <div class="section-title">
      📋 Recent Activity
    </div>
    <div class="activity-list" id="activityList">
      <div class="activity-item">
        <div class="a-icon">👋</div>
        <div class="a-info">
          <div class="a-title">Welcome to Nebula Cloud!</div>
          <div class="a-sub">Upload your first file</div>
        </div>
        <div class="a-time">now</div>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
